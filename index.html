<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/glasses-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ArkSight - Vision Simulator</title>
    <meta name="description" content="ArkSight is an interactive vision simulator that helps you understand different eye conditions and visual impairments through real-time simulation." />
    <meta name="keywords" content="vision simulator, eye conditions, visual impairment, accessibility, eye health, vision testing" />
    <meta property="og:title" content="ArkSight - Vision Simulator" />
    <meta property="og:description" content="Interactive vision simulator to understand different eye conditions and visual impairments" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ArkSight - Vision Simulator" />
    <meta name="twitter:description" content="Interactive vision simulator to understand different eye conditions and visual impairments" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <link rel="preload" href="/src/main.js" as="script">
  </head>
  <body>
    <div id="app">
      <!-- Loading spinner while app initializes (SVG avoids Vite Windows inline-CSS proxy bug) -->
      <div id="loading-spinner" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;display:flex;flex-direction:column;align-items:center;color:#2196F3;font-family:'Source Sans 3',system-ui,sans-serif">
        <svg width="40" height="40" viewBox="0 0 40 40" style="margin-bottom:16px" aria-hidden="true">
          <circle cx="20" cy="20" r="16" fill="none" stroke="#f3f3f3" stroke-width="4"/>
          <circle cx="20" cy="20" r="16" fill="none" stroke="#2196F3" stroke-width="4" stroke-linecap="round" stroke-dasharray="80" stroke-dashoffset="60">
            <animateTransform attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="1s" repeatCount="indefinite"/>
          </circle>
        </svg>
        <div>Loading ArkSight...</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
